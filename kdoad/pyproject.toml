[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdoad"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.*",
    "hydra-core==1.3.4",
    "omegaconf==2.3.1",
    "tqdm==4.70.0",
    "pytorchvideo==0.1.5",
    "timm==1.0.28",
    "torchcodec==0.11.1",
    "scikit-learn==1.9.0",
    "pandas==2.3.3"
]

[tool.setuptools.packages.find]
where = ["src"]
