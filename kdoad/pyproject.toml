[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kdoad"
version = "0.1.0"
description = "Knowledge-distilled encoders for online action detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "R. B. Rybka" },
    { name = "V. E. Latalin" },
    { name = "M. S. Skorokhodov" },
    { name = "I. A. Moloshnikov" },
    { name = "A. V. Gryaznov" },
    { name = "A. G. Sboev" },
    { name = "V. A. Ilyin" },
]
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.*",
    "hydra-core==1.3.4",
    "omegaconf==2.3.1",
    "tqdm==4.70.0",
    "pytorchvideo==0.1.5",
    "timm==1.0.28",
    "torchcodec==0.11.1",
    "scikit-learn==1.9.0",
    "pandas==2.3.3",
    "gdown==6.4.2",
    "huggingface_hub==2.2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
